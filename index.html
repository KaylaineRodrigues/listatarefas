<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lista de Tarefas</title>
  <link rel="stylesheet" href="style.css" />
  <script src="script.js"></script>
</head>
<body>
  <div class="container">
    <h1><span>&lt;</span>INCODE<br />TECH SCHOOL <span>/&gt;</span></h1>
    
    <p>Sua lista de tarefas da semana</p>

        <input type="text" id="novaTarefa" placeholder="Digite suas tarefas" />
      <button onclick="adicionarTarefa()">Adicionar Tarefa</button>
      </div>
    </div>

    <ul class="lista" id="listaTarefas"></ul>

  </div>
</body>
